<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Create your account and get started.">
	<title>Create an account</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1d2939;
			--muted: #667085;
			--line: #d0d5dd;
			--paper: #ffffff;
			--accent: #176b87;
			--accent-dark: #0f4d62;
			--background: #f4f8f7;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px 16px;
			color: var(--ink);
			background: linear-gradient(135deg, #e8f3f0, var(--background) 55%, #f7efe5);
			font-family: Georgia, "Times New Roman", serif;
		}

		.register-card {
			width: min(100%, 460px);
			padding: clamp(28px, 6vw, 48px);
			background: var(--paper);
			border: 1px solid rgba(23, 107, 135, 0.12);
			box-shadow: 0 18px 50px rgba(29, 41, 57, 0.12);
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--accent);
			font-family: Arial, sans-serif;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2rem, 7vw, 2.8rem);
			line-height: 1.05;
		}

		.intro {
			margin: 14px 0 28px;
			color: var(--muted);
			font-size: 1rem;
			line-height: 1.6;
		}

		form {
			display: grid;
			gap: 17px;
		}

		.field {
			display: grid;
			gap: 7px;
		}

		label {
			font-family: Arial, sans-serif;
			font-size: 0.86rem;
			font-weight: 700;
		}

		input {
			width: 100%;
			padding: 13px 14px;
			color: var(--ink);
			background: #fcfdfd;
			border: 1px solid var(--line);
			border-radius: 4px;
			font: 1rem Georgia, "Times New Roman", serif;
		}

		input:focus {
			outline: 3px solid rgba(23, 107, 135, 0.18);
			border-color: var(--accent);
		}

		.terms {
			display: flex;
			align-items: flex-start;
			gap: 9px;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.8rem;
			line-height: 1.45;
		}

		.terms input {
			width: auto;
			margin-top: 3px;
			accent-color: var(--accent);
		}

		.terms a,
		.login a {
			color: var(--accent-dark);
			font-weight: 700;
		}

		button {
			margin-top: 4px;
			padding: 14px 18px;
			color: #ffffff;
			background: var(--accent);
			border: 0;
			border-radius: 4px;
			cursor: pointer;
			font-family: Arial, sans-serif;
			font-size: 0.95rem;
			font-weight: 700;
		}

		button:hover {
			background: var(--accent-dark);
		}

		button:focus-visible,
		a:focus-visible {
			outline: 3px solid rgba(23, 107, 135, 0.35);
			outline-offset: 3px;
		}

		.login {
			margin: 24px 0 0;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.88rem;
			text-align: center;
		}
	</style>
</head>
<body>
	<main class="register-card">
		<p class="eyebrow">Join us</p>
		<h1>Create your account</h1>
		<p class="intro">Sign up in a few seconds and start your journey with us.</p>

		<form action="#" method="post">
			<div class="field">
				<label for="full-name">Full name</label>
				<input type="text" id="full-name" name="full_name" autocomplete="name" required>
			</div>

			<div class="field">
				<label for="email">Email address</label>
				<input type="email" id="email" name="email" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
			</div>

			<div class="field">
				<label for="confirm-password">Confirm password</label>
				<input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required>
			</div>

			<label class="terms" for="terms">
				<input type="checkbox" id="terms" name="terms" required>
				<span>I agree to the <a href="#terms">terms and conditions</a>.</span>
			</label>

			<button type="submit">Create account</button>
		</form>

		<p class="login">Already have an account? <a href="landingpage.html">Sign in</a></p>
	</main>
</body>
</html>
